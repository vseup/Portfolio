<section class="project-section" [attr.aria-labelledby]="resolvedHeadingId()">
  <div class="text col">
    <h2 [id]="resolvedHeadingId()">{{ title() }}</h2>
    <div class="project-section-content">
      <ng-content></ng-content>
    </div>
  </div>
  @if (image()) {
    <div class="project-section-image">
      <figure>
        <img
          [ngSrc]="image()!.src"
          [alt]="image()!.alt"
          [width]="image()!.width"
          [height]="image()!.height"
        />
        @if (imageCaption()) {
          <figcaption class="image-caption">{{ imageCaption() }}</figcaption>
        }
      </figure>
    </div>
  }
</section>
