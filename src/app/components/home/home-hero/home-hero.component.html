<section class="hero" aria-labelledby="home-title">
  <div class="hero-copy">
    <h1 id="home-title">
      Hi, I'm Verena -
      <span class="accent" aria-hidden="true">
        {{ typedPhrase() }}<span class="type-cursor" aria-hidden="true"></span>
      </span>
      <span class="sr-only" aria-live="polite">{{ currentPhrase() }}</span>
    </h1>

    <p class="default-text">
      As a software engineer with a background in communication design and Human-Computer
      Interaction I build thoughtful, maintainable digital products that put people first.
    </p>

    <div class="hero-actions">
      <app-router-button routerLink="/" fragment="projects">View Projects</app-router-button>
      <app-anchor-button
        [isSecondary]="true"
        href="https://github.com/vseup"
        target="_blank"
        rel="noopener noreferrer"
      >
        GitHub
      </app-anchor-button>
    </div>
  </div>

  <div class="hero-visual" aria-hidden="true">
    <app-home-avatar></app-home-avatar>
  </div>
</section>
