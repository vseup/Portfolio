<a
  class="project-card-link"
  [routerLink]="project().detailsRoute"
  [attr.aria-label]="'Open project details for ' + project().title"
>
  <article class="project-card">
    @if (project().previewImage; as image) {
      <div class="card-cover card-cover-image">
        <img [ngSrc]="image.src" [alt]="image.alt" [width]="image.width" [height]="image.height" />
      </div>
    } @else {
      <div [class]="'card-cover ' + project().toneClass"></div>
    }
    <div class="card-body">
      <app-eyebrow [area]="project().area" [period]="project().period"></app-eyebrow>
      <h3>{{ project().title }}</h3>
      <p class="card-summary default-text">{{ project().summary }}</p>
      <app-tags [title]="project().title" [tags]="project().tags"></app-tags>
    </div>
  </article>
</a>
