<div class="avatar" #avatar>
  <img ngSrc="/images/hero-avatar.png" alt="" width="1254" height="1254" priority />

  <div class="avatar-eyes">
    <span class="eye eye-left">
      <span class="pupil" [style.transform]="pupilTransform()"></span>
    </span>

    <span class="eye eye-right">
      <span class="pupil" [style.transform]="pupilTransform()"></span>
    </span>
  </div>
</div>
