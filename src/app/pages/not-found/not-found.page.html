<article class="not-found-page" aria-labelledby="not-found-title">
  <div class="content">
    <p class="code" aria-hidden="true">404</p>
    <h1 id="not-found-title">Page not found</h1>
    <p class="default-text">
      The page you are looking for does not exist or has been moved.
    </p>
    <div class="actions">
      <app-router-button routerLink="/">Go to Home</app-router-button>
      <app-router-button [isSecondary]="true" routerLink="/about">About</app-router-button>
    </div>
  </div>
</article>
