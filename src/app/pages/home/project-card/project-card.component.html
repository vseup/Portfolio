<article class="project-card">
  @if (project().previewImage; as image) {
    <div class="card-cover card-cover-image">
      <img
        [ngSrc]="image.src"
        [alt]="image.alt"
        [width]="image.width"
        [height]="image.height"
      />
    </div>
  } @else {
    <div [class]="'card-cover ' + project().toneClass"></div>
  }
  <div class="card-body">
    <p class="card-area">{{ project().area }} · {{ project().period }}</p>
    <h3>{{ project().title }}</h3>
    <p class="card-summary">{{ project().summary }}</p>
    <ul class="tag-list" [attr.aria-label]="'Technology tags for ' + project().title">
      @for (tag of project().tags; track tag) {
      <li>{{ tag }}</li>
      }
    </ul>
  </div>
</article>
