<app-home-hero></app-home-hero>
<app-divider class="divider"></app-divider>

<section id="projects" class="projects" aria-labelledby="projects-title">
  <header class="projects-header">
    <h2 id="projects-title">Selected Projects</h2>
    <p class="default-text">
      A collection of private and university projects spanning software engineering, UX design, and
      human-computer interaction.
    </p>
  </header>

  <ul class="project-grid" aria-label="Selected project cards">
    @for (project of projectCards; track project.title) {
      <li>
        <app-project-card [project]="project"></app-project-card>
      </li>
    }
  </ul>
</section>
